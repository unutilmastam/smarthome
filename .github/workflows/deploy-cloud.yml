name: deploy-cloud

# Deploys the backend + PWA to the hostmaster.uz cPanel account over SSH.
# Runs only when the repository variable DEPLOY_ENABLED is "true" and the secrets
# below exist (docs/runbooks/deploy.md). Nothing here contains a secret.
#
# Secrets: CPANEL_SSH_HOST, CPANEL_SSH_PORT, CPANEL_SSH_USER, CPANEL_SSH_KEY,
#          CPANEL_KNOWN_HOSTS
# Variables: DEPLOY_ENABLED, CPANEL_APP_DIR (e.g. smarthome-api),
#            CPANEL_WEB_DIR (e.g. home.example.uz), CPANEL_VENV_ACTIVATE
#            (e.g. /home/USER/virtualenv/smarthome-api/3.10/bin/activate), PUBLIC_URL

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build PWA
        working-directory: apps/web
        run: npm ci && npx vite build
      - name: Assemble release
        run: sh infra/cpanel/build_release.sh release
      - name: SSH setup
        env:
          KEY: ${{ secrets.CPANEL_SSH_KEY }}
          KNOWN: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Upload
        env:
          HOST: ${{ secrets.CPANEL_SSH_HOST }}
          PORT: ${{ secrets.CPANEL_SSH_PORT }}
          USER: ${{ secrets.CPANEL_SSH_USER }}
          APP: ${{ vars.CPANEL_APP_DIR }}
          WEB: ${{ vars.CPANEL_WEB_DIR }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p ${PORT:-22} -o StrictHostKeyChecking=yes"
          # .env, tmp/ (Passenger restart) and logs stay on the server.
          rsync -az --delete -e "$SSH" --exclude '.env' --exclude 'tmp/' --exclude 'logs/' \
            release/api/ "$USER@$HOST:$APP/"
          rsync -az --delete -e "$SSH" release/web/ "$USER@$HOST:$WEB/"
      - name: Install, migrate, restart
        env:
          HOST: ${{ secrets.CPANEL_SSH_HOST }}
          PORT: ${{ secrets.CPANEL_SSH_PORT }}
          USER: ${{ secrets.CPANEL_SSH_USER }}
          APP: ${{ vars.CPANEL_APP_DIR }}
          WEB: ${{ vars.CPANEL_WEB_DIR }}
          VENV: ${{ vars.CPANEL_VENV_ACTIVATE }}
        run: |
          ssh -i ~/.ssh/id_deploy -p ${PORT:-22} -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "set -e; cd '$APP'; . '$VENV'; pip install -q -r requirements.txt; \
             python -m alembic upgrade head; mkdir -p tmp; touch tmp/restart.txt; \
             python -m app.jobs.no_video_check \"\$HOME/$APP\" \"\$HOME/$WEB\""
      - name: Health check
        env:
          URL: ${{ vars.PUBLIC_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/api/v1/health"; then exit 0; fi
            sleep 10
          done
          echo "health check failed" >&2; exit 1
