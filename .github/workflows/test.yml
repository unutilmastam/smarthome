name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smarthome
          POSTGRES_PASSWORD: smarthome
          POSTGRES_DB: smarthome_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smarthome"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      TEST_POSTGRES_URL: postgresql+psycopg://smarthome:smarthome@localhost:5432/smarthome_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            services/backend/requirements*.txt
            packages/contracts/requirements-test.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/contracts/requirements-test.txt
          pip install -r services/backend/requirements-dev.txt
      - name: Contracts tests
        run: python -m pytest packages/contracts -q
      - name: Backend tests
        working-directory: services/backend
        run: python -m pytest -q
