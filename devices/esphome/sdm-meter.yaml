# ESP32 + Eastron SDM120 (1-phase) over RS485/Modbus (MAX485 module) — DIN-rail,
# professional meter (ARCHITECTURE 10). For 3-phase SDM630 add phase_b/phase_c and
# publish per-phase values as separate devices or extend the contract first.
substitutions:
  device_key: sdm_meter
  friendly_name: "SDM hisoblagich"
  tx_pin: GPIO17
  rx_pin: GPIO16
  flow_pin: GPIO4

packages:
  base: !include common/base.yaml

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 2400
  stop_bits: 1

modbus:
  flow_control_pin: ${flow_pin}

sensor:
  - platform: sdm_meter
    address: 1
    update_interval: 10s
    phase_a:
      voltage: { id: v, name: voltage, state_topic: null }
      current: { id: a, name: current, state_topic: null }
      active_power: { id: w, name: power, state_topic: null }
      power_factor: { id: pf, name: power_factor, state_topic: null }
    frequency: { id: hz, name: frequency, state_topic: null }
    total_power: { id: wt, name: total_power, state_topic: null }
    import_active_energy: { id: kwh, name: energy, state_topic: null }

interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return !std::isnan(id(v).state);'
          then:
            - mqtt.publish_json:
                topic: home/${device_key}/telemetry
                qos: 0
                payload: |-
                  root["schema"] = 1;
                  root["source"] = "reported";
                  JsonObject m = root["states"]["power_meter"].to<JsonObject>();
                  m["voltage"] = id(v).state;
                  m["current"] = id(a).state;
                  m["power"] = id(w).state;
                  if (!std::isnan(id(kwh).state)) m["energy"] = id(kwh).state;
                  if (!std::isnan(id(pf).state)) m["power_factor"] = std::fabs(id(pf).state);
                  if (!std::isnan(id(hz).state)) m["frequency"] = id(hz).state;
