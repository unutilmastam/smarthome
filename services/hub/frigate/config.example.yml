# Frigate NVR (runs ONLY on the hub). Copy to frigate/config.yml and edit.
# Video, snapshots and clips stay on the hub's HDD; nothing is sent to the cloud
# (ADR 0006). Cameras live on their own VLAN without internet access (H-07).
# Credentials come from FRIGATE_* environment variables (.env), never from this file.
mqtt:
  enabled: false        # the gateway reads Frigate's HTTP API instead

database:
  path: /config/frigate.db

auth:
  enabled: true         # port 8971: login required (also over Tailscale)

go2rtc:
  streams:
    gate_cam:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.20.11:554/stream1
    gate_cam_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.20.11:554/stream2

record:
  enabled: true
  retain:
    days: 7             # continuous; adjust to the HDD size
    mode: motion
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 14

snapshots:
  enabled: true
  retain:
    default: 14

cameras:
  gate_cam:             # = frigate_name of the camera in the app (device key cam_gate_cam)
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/gate_cam
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/gate_cam_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      width: 640
      height: 360
      fps: 5
    objects:
      track: [person, car]
